<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zilky · Panel de negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark">Z</span>
        <div><strong>Zilky</strong><div class="brand-sub">Panel de negocio</div></div>
      </div>
      <div class="segmented" id="authTabs" style="margin-bottom:18px">
        <button type="button" class="active" data-mode="login">Iniciar sesión</button>
        <button type="button" data-mode="registro">Crear cuenta</button>
      </div>
      <div id="authNombreField" class="field" style="display:none">
        <label>Tu nombre</label>
        <input id="authNombre" placeholder="Ej: Ulises" />
      </div>
      <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="vos@ejemplo.com" autocomplete="username" /></div>
      <div class="field"><label>Contraseña</label><input id="authPassword" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" /></div>
      <div id="authError" class="auth-error" style="display:none"></div>
      <button class="btn btn-primary btn-block btn-lg" id="authSubmit">Entrar</button>
      <div class="auth-hint">Se guarda en este dispositivo: la próxima vez entrás directo.</div>
    </div>
  </div>

  <div id="root" style="display:none">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark" id="brandMark">Z</span>
        <div class="brand-text"><strong id="negocioNombre">Todos los negocios</strong><span class="brand-sub">Panel de control</span></div>
      </div>
      <button class="negocio-switch" id="btnNegocioSwitch" aria-label="Cambiar de negocio">
        <span id="negocioSwitchLabel">Cambiar</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main id="view" class="view"></main>

    <button class="fab" id="fabButton" aria-label="Crear">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <nav class="bottomnav">
      <a href="#/inicio" class="nav-item" data-route="inicio">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#/clientes" class="nav-item" data-route="clientes">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 20c.8-3.4 3-5.2 5.5-5.2S13.7 16.6 14.5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 5.5a3 3 0 0 1 0 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 14.9c2 .4 3.5 2 4 5.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Clientes</span>
      </a>
      <a href="#/cobrar" class="nav-item nav-cobrar" data-route="cobrar">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><path d="M7 14.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Cobrar</span>
      </a>
      <a href="#/calendario" class="nav-item" data-route="calendario">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9.5h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Calendario</span>
      </a>
      <a href="#/mas" class="nav-item" data-route="mas">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
        <span>Más</span>
      </a>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div id="sheetRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="/app.js"></script>
</body>
</html>
