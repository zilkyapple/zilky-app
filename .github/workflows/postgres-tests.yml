name: Etapas 1 y 2 - PostgreSQL

on:
  push:
    branches: [main, qa/etapas12-validation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    env:
      TEST_DATABASE_URL: postgresql://zilky_test:disposable-ci-only@127.0.0.1:55432/zilky_stage2_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Disposable PostgreSQL
        run: |
          PG_BIN=$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)
          test -x "$PG_BIN/initdb"
          sudo install -d -o postgres -g postgres /tmp/zilky-pg
          sudo -u postgres "$PG_BIN/initdb" -D /tmp/zilky-pg -A trust --no-locale
          sudo -u postgres "$PG_BIN/pg_ctl" -D /tmp/zilky-pg -l /tmp/zilky-pg.log -o '-h 127.0.0.1 -p 55432' -w start
          sudo -u postgres "$PG_BIN/createuser" -h 127.0.0.1 -p 55432 zilky_test
          sudo -u postgres "$PG_BIN/createdb" -h 127.0.0.1 -p 55432 -O zilky_test zilky_stage2_test
          "$PG_BIN/psql" -h 127.0.0.1 -p 55432 -U zilky_test -d zilky_stage2_test -c 'SELECT version()'
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Full regression suite with PostgreSQL
        run: npm test
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Browser regression (disposable data)
        if: matrix.node == 24
        env:
          PLAYWRIGHT_MODULE: /tmp/zilky-playwright/node_modules/playwright-core/index.mjs
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          BROWSER_ARTIFACTS: /tmp/zilky-sales-browser
        run: |
          npm install --prefix /tmp/zilky-playwright --no-save --ignore-scripts --no-fund playwright-core@1.62.1
          node test/browser-ventas-comisiones.mjs
          BROWSER_ARTIFACTS=/tmp/zilky-sales-browser/pagos node test/browser-fecha-pago.mjs
          BROWSER_ARTIFACTS=/tmp/zilky-sales-browser/proyeccion node test/browser-proyeccion.mjs
          BROWSER_ARTIFACTS=/tmp/zilky-sales-browser/venta-error node test/browser-venta-error.mjs
          BROWSER_ARTIFACTS=/tmp/zilky-sales-browser/fecha-compra node test/browser-fecha-compra.mjs
      - name: Browser screenshots and results
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ventas-comisiones-browser
          path: /tmp/zilky-sales-browser
          retention-days: 7
